name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-protos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Validate proto files compile
        run: |
          protoc --proto_path=proto \
            --descriptor_set_out=/dev/null \
            proto/*.proto
          echo "All proto files are valid"
